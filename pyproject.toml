[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gib-bench"
version = "1.0.1"
description = "GIB-200K: a diagnostic benchmark for grounding failures in multimodal RAG"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT (code); CC BY 4.0 (annotations)"}
dependencies = ["numpy>=2.0", "pandas>=2.1", "scipy>=1.11", "pillow>=10", "matplotlib>=3.8", "pyyaml>=6", "tqdm>=4.66"]

[project.optional-dependencies]
gpu = ["torch>=2.3", "transformers>=4.49", "accelerate>=0.33", "bitsandbytes>=0.43"]
api = ["openai>=1.40", "google-genai>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
gib = "gib.cli:main"

[tool.setuptools.packages.find]
include = ["gib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
